<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Clínica Artus · logo 3D (mobile)</title>
    <script src="lib/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three/three.module.js" } }
    </script>
    <style>
      /* Cores do site da Clínica Artus (styles.css): --petrol e o brilho do cartão de contato. */
      :root {
        --fundo: #123e48;
        --brilho: #16818a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fundo);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--fundo);
      }
      #fundo,
      #cena {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.5"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="fundo" class="clip" data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics"></canvas>
      <canvas
        id="cena"
        class="clip"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
      ></canvas>
    </div>

    <script>
      // A cena 3D é desenhada a partir do tempo (evento hf-seek). A timeline só marca a duração.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const relogio = { t: 0 };
      tl.to(relogio, { t: 3.5, duration: 3.5, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import { montarCena } from "./lib/cena-logo.js";
      import { desenharFundo } from "./lib/fundo-pontilhado.js";
      // larguraLogo: largura da logo, em pixels, quando ela assenta de frente.
      // Degradê do fundo com pontilhado, para não formar faixas no vídeo.
      desenharFundo(document.getElementById("fundo"), 1080, 1920);
      montarCena({ canvas: document.getElementById("cena"), largura: 1080, altura: 1920, larguraLogo: 440 });
    </script>
  </body>
</html>
